# Render blueprint for the backend: New > Blueprint, then pick this repository.
services:
  - type: web
    name: lldpad-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/problems
    envVars:
      - key: MONGODB_URI
        sync: false   # entered in the Render dashboard, never committed
      - key: MONGODB_DATABASE
        value: lldpad
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      # The Vercel URL, e.g. https://lldpad.vercel.app. Requests arrive through Vercel's proxy, so this
      # is only a fallback in case forwarded headers are lost, but it keeps login working either way.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
